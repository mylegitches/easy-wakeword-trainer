# docker-compose.dev.yml — quick UI test + data download (no training deps)
# Usage:
#   docker compose -f docker-compose.dev.yml up --build           # start UI
#   docker compose -f docker-compose.dev.yml run --rm prepare     # download data
services:
  trainer-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./outputs:/outputs
      - ./data/oww-models:/app/openwakeword/openwakeword/resources/models
    environment:
      - DATA_DIR=/data
      - OUTPUT_DIR=/outputs
      - OPENWAKEWORD_DIR=/app/openwakeword
      - PIPER_GENERATOR_DIR=/app/piper-sample-generator
    shm_size: '4gb'   # PyTorch DataLoader workers use /dev/shm; default 64 MB causes bus errors
    restart: unless-stopped

  # Download all required training assets into ./data (one-time, ~5-20 GB)
  prepare:
    build:
      context: .
      dockerfile: Dockerfile.prepare
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
